<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://kit.fontawesome.com/db69dc4f40.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <div class="header box">
            <i class="fa-solid fa-arrow-left"></i>
            <h1>Weather App</h1>

        </div>
        <div class="content box">
            <p>
                <img id="condImg" src="" />
                <br />
                <span id="degrees">
                </span><br />
                <span id="condition">
                </span>
                <br />
                <i class="fa-solid fa-location-dot"></i>
                <span id="area">
                </span>

            </p>
        </div>
        <div class="footer box">
            <div class="box" id="leftfooter">
                <p>
                    <span id="feels-like">
                    </span>
                    <br />
                    feels like
                </p>
                <i class="fa-solid fa-temperature-empty"></i>
            </div>
            <div class="box" id="rightfooter">
                <p><span id="humidity"> </span><br /> Humidity </p><i class="fa-solid fa-droplet"></i>
            </div>
        </div>


        <script src="main.js"></script>
</body>

</html>
