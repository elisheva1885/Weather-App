<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet">
        <script src="https://kit.fontawesome.com/db69dc4f40.js" crossorigin="anonymous"></script>

</head>

<body>
    <div class="container">
        <div class="header box">
            <i class="fa-solid fa-arrow-left"></i>
            <h1 class="poppins-regular">Weather App</h1>

        </div>
        <div class="content box">
          
                <img id="condImg" src="" />
                <br />
                <span id="degrees" class="poppins-regular">

                </span>
                <span id="degrees">
                    ℃
                </span><br /><br />
                <span id="condition" class="poppins-regular">
                </span>
                <br /><br />
                <i class="fa-solid fa-location-dot"></i>
                <span id="area" class="poppins-regular">
                </span>  
        </div>
        <div class="footer box">
            <div class="box" id="leftfooter">
                <p>
                    <span id="feels-like" class="poppins-regular">
                    </span>
                    <span id="degrees-like" class="poppins-regular">
                        ℃
                    </span>
                    <br />
                    <span class="poppins-regular">
                        Feels like
                    </span>

                </p>
                <i class="fa-solid fa-temperature-empty"></i>
            </div>
            <div class="box" id="rightfooter">
                <span id="humidity" class="poppins-regular"> </span><br /> <span class="poppins-regular"> Humidity
                    </span>
               <i class="fa-solid fa-droplet"></i>
            </div>
        </div>


        <script src="main.js"></script>
</body>

</html>
